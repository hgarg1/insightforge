name: Feature request
description: Propose a focused product improvement.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user problem or workflow limitation should be addressed?
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: Describe the successful user experience without prescribing implementation details.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: dropdown
    id: area
    attributes:
      label: Product area
      options:
        - Authentication
        - Workbook import and profiling
        - Analytics and visualization
        - Dashboards and exports
        - Desktop UI and accessibility
        - API and storage
        - Installer and releases
        - Documentation
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Submission checks
      options:
        - label: I searched existing issues for similar requests.
          required: true
        - label: This request does not contain private workbook data or credentials.
          required: true
