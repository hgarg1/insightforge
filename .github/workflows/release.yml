name: Build and publish Windows installer

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build Windows installer and create release
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Check out tagged source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Validate release tag and package version
        id: release
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME
          if ($tag -notmatch '^v(?<version>\d+\.\d+\.\d+)$') {
              throw "Release tags must use vMAJOR.MINOR.PATCH format. Received: $tag"
          }

          $version = $Matches.version
          $projectVersion = python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])"
          if ($version -ne $projectVersion) {
              throw "Tag version $version does not match pyproject.toml version $projectVersion."
          }

          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Install project dependencies
        shell: pwsh
        run: |
          python -m venv .venv
          .\.venv\Scripts\python.exe -m pip install --upgrade pip
          .\.venv\Scripts\python.exe -m pip install -e ".[dev]"

      - name: Install Inno Setup 7
        shell: pwsh
        run: |
          winget install `
            --id JRSoftware.InnoSetup.7 `
            --exact `
            --source winget `
            --accept-source-agreements `
            --accept-package-agreements `
            --silent `
            --disable-interactivity

      - name: Import optional Authenticode certificate
        id: certificate
        shell: pwsh
        env:
          SIGNING_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_BASE64 }}
          SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_PASSWORD }}
        run: |
          if (-not $env:SIGNING_CERTIFICATE_BASE64) {
              Write-Host "No signing certificate configured; building an unsigned installer."
              exit 0
          }
          $certificatePath = Join-Path $env:RUNNER_TEMP "insightforge-signing.pfx"
          [IO.File]::WriteAllBytes(
              $certificatePath,
              [Convert]::FromBase64String($env:SIGNING_CERTIFICATE_BASE64)
          )
          $password = ConvertTo-SecureString $env:SIGNING_CERTIFICATE_PASSWORD -AsPlainText -Force
          $certificate = Import-PfxCertificate `
              -FilePath $certificatePath `
              -CertStoreLocation Cert:\CurrentUser\My `
              -Password $password
          Remove-Item -LiteralPath $certificatePath -Force
          "thumbprint=$($certificate.Thumbprint)" >> $env:GITHUB_OUTPUT

      - name: Build and verify installer
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          CERTIFICATE_THUMBPRINT: ${{ steps.certificate.outputs.thumbprint }}
        run: |
          $parameters = @{
              Clean = $true
              Version = $env:RELEASE_VERSION
              BuildNumber = [int]$env:GITHUB_RUN_NUMBER
          }
          if ($env:CERTIFICATE_THUMBPRINT) {
              $parameters.CertificateThumbprint = $env:CERTIFICATE_THUMBPRINT
          }
          .\scripts\build_installer.ps1 @parameters

      - name: Remove imported certificate
        if: always() && steps.certificate.outputs.thumbprint != ''
        shell: pwsh
        env:
          CERTIFICATE_THUMBPRINT: ${{ steps.certificate.outputs.thumbprint }}
        run: Remove-Item "Cert:\CurrentUser\My\$env:CERTIFICATE_THUMBPRINT" -Force

      - name: Preserve workflow artifacts
        uses: actions/upload-artifact@v7
        with:
          name: InsightForge-${{ steps.release.outputs.version }}-Windows
          path: |
            dist/InsightForge-${{ steps.release.outputs.version }}-Setup.exe
            dist/InsightForge-${{ steps.release.outputs.version }}-Setup.exe.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          gh release create $env:GITHUB_REF_NAME `
            "dist/InsightForge-$env:RELEASE_VERSION-Setup.exe" `
            "dist/InsightForge-$env:RELEASE_VERSION-Setup.exe.sha256" `
            --verify-tag `
            --generate-notes `
            --title "InsightForge $env:RELEASE_VERSION"
